<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>MVVM – Todo-list</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 480px;
        margin: 40px auto;
      }
      .done {
        text-decoration: line-through;
        color: #888;
      }
      .error {
        color: #c8483f;
      }
      .actif {
        font-weight: bold;
        background-color: #FFD65A;
      }
      li {
        margin: 6px 0;
      }
    </style>
  </head>
  <body>
    <h1>Todo-list (MVVM)</h1>
    <div id="app">
      <form>
        <input placeholder="Nouvelle tâche" autofocus /> <button>Ajouter</button>
      </form>
      <p class="error"></p>
      <nav aria-label="Filtrer les tâches">
        <button type="button" data-filtre="toutes">Toutes</button>
        <button type="button" data-filtre="faites">Faites</button>
        <button type="button" data-filtre="a-faire">À faire</button>
      </nav>
      <ul></ul>
      <p class="counter"></p>
    </div>
    <script type="module">
      import { TodoViewModel } from './TodoViewModel.js';

      const vm = new TodoViewModel();
      const form = document.querySelector('form');
      const titre = document.querySelector('form input');
      const liste = document.querySelector('ul');
      const compteur = document.querySelector('.counter');
      const erreur = document.querySelector('.error');
      const filtres = document.querySelectorAll('[data-filtre]');

      form.onsubmit = event => {
        event.preventDefault();
        vm.ajouter(titre.value);
        titre.value = '';
      };
      filtres.forEach(bouton => {
        bouton.onclick = () => vm.changerFiltre(bouton.dataset.filtre);
      });
      vm.erreur.subscribe(message => (erreur.textContent = message));
      vm.restantes.subscribe(nombre => (compteur.textContent = `${nombre} tâche(s) à faire`));
      vm.filtre.subscribe(nom => {
        filtres.forEach(bouton => bouton.classList.toggle('actif', bouton.dataset.filtre === nom));
      });
      vm.visibles.subscribe(todos => {
        liste.innerHTML = '';
        todos.forEach(todo => {
          const element = document.createElement('li');
          const caseACocher = document.createElement('input');
          const texte = document.createElement('span');
          const supprimer = document.createElement('button');

          caseACocher.type = 'checkbox';
          caseACocher.checked = todo.done;
          caseACocher.onchange = () => vm.basculer(todo.id);
          texte.textContent = todo.title;
          texte.classList.toggle('done', todo.done);
          supprimer.type = 'button';
          supprimer.textContent = '✕';
          supprimer.onclick = () => vm.supprimer(todo.id);
          element.append(caseACocher, ' ', texte, ' ', supprimer);
          liste.append(element);
        });
      });
    </script>
  </body>
</html>
